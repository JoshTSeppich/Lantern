# L-07 discrimination site pool — PRE-REGISTERED
#
# Commit: chore(L-07) — committed BEFORE harness/run_discrimination.py is invoked.
# Any change to this list AFTER evidence collection begins is a rubric-drift
# event per BUILD.md §R4.
#
# Pool size: 40. Per operator 2026-04-21: "corpus size 40, take first 30 ok.
# Run all 40 probes, take the first 30 that returned ok in deterministic
# site-ID-sorted order. If fewer than 25 survive, halt before clustering."
#
# Category distribution (7/7/7/7/6/6 = 40):
#   7 e-commerce (over-provision: L-06 saw 1/2 e-commerce fail)
#   7 news       (over-provision: L-06 saw 2/2 news fail)
#   7 saas       (over-provision: L-06 saw 1/2 saas fail — SPA networkidle)
#   7 marketing
#   6 forum
#   6 misc
#
# Site-ID scheme: d01..d40 round-robin-interleaved by category. First six IDs
# are one-per-category; then cycle. This produces balanced category coverage
# under the first-30-ok mechanical filter even if some sites fail:
#   - all 40 ok → first 30 = 5 per category × 6 (perfectly balanced)
#   - asymmetric failures → first 30 contains mix but not dominated by any
#     single category
#
# Stability assumption (inherited from L-06): entry pages chosen to be mostly-
# static. News picks lean toward Wikipedia's news portal + older/minimal-JS
# sites (slashdot, NPR) — L-06's failure of modern editorial JS stacks (Ars,
# Verge) is accepted as real-world signal, over-provisioned against.
#
# Automation compatibility: L-06 experience inherited. Known-hostile sites
# (Amazon-class, Google search, aggressive Cloudflare-gated) deliberately
# avoided. SPA-heavy SaaS logins that failed L-06 (Asana) replaced with
# server-rendered variants (GitHub, GitLab) plus a few SPAs for variety.

category_distribution:
  e-commerce: 7
  news: 7
  saas: 7
  marketing: 7
  forum: 6
  misc: 6

